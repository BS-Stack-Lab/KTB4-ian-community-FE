name: FE / CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fe-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-test:
    name: FE / quality-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format
        id: format
        run: npm run format:check
      - name: Build
        id: build
        env:
          APP_VERSION: ${{ github.sha }}
        run: npm run build:react
      - name: Reproducible contenthash build
        id: reproducible_build
        env:
          APP_VERSION: ${{ github.sha }}
        run: ./scripts/verify-reproducible-build.sh
      - name: Unit tests
        id: unit
        run: >-
          npx vitest run tests/unit
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/unit.xml
      - name: Integration tests
        id: integration
        run: >-
          npx vitest run tests/integration
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/integration.xml
      - name: Production bundle policy
        id: bundle_policy
        run: ./scripts/verify-build.sh
      - name: Workflow and gate policy tests
        id: workflow_policy
        run: |
          ./scripts/verify-workflows.sh
          ./scripts/test-required-gate.sh
      - name: Upload web root and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fe-web-root-and-tests-${{ github.sha }}
          path: |
            build/
            test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Write quality summary
        if: always()
        env:
          FORMAT_RESULT: ${{ steps.format.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          UNIT_RESULT: ${{ steps.unit.outcome }}
          INTEGRATION_RESULT: ${{ steps.integration.outcome }}
          BUNDLE_RESULT: ${{ steps.bundle_policy.outcome }}
          WORKFLOW_RESULT: ${{ steps.workflow_policy.outcome }}
          REPRODUCIBLE_RESULT: ${{ steps.reproducible_build.outcome }}
        run: |
          {
            echo "## Frontend quality"
            echo
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
            echo "- Format: ${FORMAT_RESULT}"
            echo "- Build: ${BUILD_RESULT}"
            echo "- Reproducible contenthash: ${REPRODUCIBLE_RESULT}"
            echo "- Unit tests: ${UNIT_RESULT}"
            echo "- Integration tests: ${INTEGRATION_RESULT}"
            echo "- Bundle policy: ${BUNDLE_RESULT}"
            echo "- Workflow policy: ${WORKFLOW_RESULT}"
            echo
            echo "### Hashed assets"
            if [[ -d build/dist ]]; then
              find build/dist -maxdepth 1 -type f \
                -name 'app.*' ! -name '*.LICENSE.txt' \
                -printf -- '- %p\n' | sort
            else
              echo "- Build output unavailable"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

  ui-test:
    name: FE / ui-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Chromium UI tests (113)
        id: ui
        run: npm run test:ui
      - name: Upload UI report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fe-ui-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Write UI summary
        if: always()
        env:
          UI_RESULT: ${{ steps.ui.outcome }}
        run: |
          {
            echo "## Frontend UI"
            echo
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
            echo "- Playwright UI tests: ${UI_RESULT}"
          } >>"${GITHUB_STEP_SUMMARY}"

  image-build:
    name: FE / image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build linux/amd64 candidate
        id: candidate
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "community-frontend:${GITHUB_SHA}" \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --build-arg "OCI_VERSION=${GITHUB_SHA}" \
            --metadata-file "${RUNNER_TEMP}/frontend-build-metadata.json" \
            .
          digest="$(jq -r '."containerimage.digest" // empty' \
            "${RUNNER_TEMP}/frontend-build-metadata.json")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

          first_archive="${RUNNER_TEMP}/frontend-runtime-1.tar"
          docker buildx build \
            --platform linux/amd64 \
            --output "type=oci,dest=${first_archive}" \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --build-arg "OCI_VERSION=${GITHUB_SHA}" \
            .
          runtime_digest="$(tar -xOf "${first_archive}" index.json | jq -r '
            [.manifests[] | select(
              .platform.os == "linux" and .platform.architecture == "amd64"
            )] | if length == 1 then .[0].digest else empty end
          ')"
          [[ "${runtime_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          second_archive="${RUNNER_TEMP}/frontend-runtime-2.tar"
          docker buildx build \
            --platform linux/amd64 \
            --output "type=oci,dest=${second_archive}" \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --build-arg "OCI_VERSION=${GITHUB_SHA}" \
            .
          rebuilt_runtime_digest="$(tar -xOf "${second_archive}" index.json | jq -r '
            [.manifests[] | select(
              .platform.os == "linux" and .platform.architecture == "amd64"
            )] | if length == 1 then .[0].digest else empty end
          ')"
          [[ "${rebuilt_runtime_digest}" == "${runtime_digest}" ]]
          echo "runtime_digest=${runtime_digest}" >>"${GITHUB_OUTPUT}"
      - name: Verify static-origin runtime
        id: image_policy
        env:
          IMAGE_TAG: community-frontend:${{ github.sha }}
        run: ./scripts/verify-image.sh
      - name: Write image summary
        if: always()
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.candidate.outputs.runtime_digest }}
          IMAGE_POLICY_RESULT: ${{ steps.image_policy.outcome }}
        run: |
          {
            echo "## Frontend candidate image"
            echo
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
            echo "- Provenance index digest: \`${CANDIDATE_DIGEST:-unavailable}\`"
            echo "- Reproducible linux/amd64 runtime digest: \`${RUNTIME_DIGEST:-unavailable}\`"
            echo "- Runtime policy: ${IMAGE_POLICY_RESULT}"
          } >>"${GITHUB_STEP_SUMMARY}"

  compose-smoke:
    name: FE / compose-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BACKEND_BOOTSTRAP_SHA: 6e8d8fbe9386b657575e9e9096b39653696f7a0a
      DEPLOYMENT_BOOTSTRAP_SHA: 6e8d8fbe9386b657575e9e9096b39653696f7a0a
      CI_HTTP_PORT: "18080"
    steps:
      - name: Checkout frontend candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: frontend
      - name: Checkout trusted deployment assets
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: BS-Stack-Lab/KTB4-ian-community-BE
          ref: ${{ vars.DEPLOYMENT_BASELINE_SHA || '6e8d8fbe9386b657575e9e9096b39653696f7a0a' }}
          path: backend-deployment
      - name: Checkout backend bootstrap source
        if: vars.BACKEND_BASELINE_IMAGE == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: BS-Stack-Lab/KTB4-ian-community-BE
          ref: ${{ vars.BACKEND_BASELINE_SHA || '6e8d8fbe9386b657575e9e9096b39653696f7a0a' }}
          path: backend-source
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build candidate frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "community-frontend:${GITHUB_SHA}" \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --build-arg "OCI_VERSION=${GITHUB_SHA}" \
            frontend
      - name: Prepare approved backend baseline
        env:
          APPROVED_IMAGE: ${{ vars.BACKEND_BASELINE_IMAGE }}
          APPROVED_SHA: ${{ vars.BACKEND_BASELINE_SHA }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${APPROVED_IMAGE}" ]]; then
            [[ "${APPROVED_IMAGE}" =~ ^ghcr\.io/bs-stack-lab/ktb4-ian-community-be@sha256:[0-9a-f]{64}$ ]]
            docker pull --platform linux/amd64 "${APPROVED_IMAGE}"
            docker tag "${APPROVED_IMAGE}" community-backend:baseline
          else
            sha="${APPROVED_SHA:-${BACKEND_BOOTSTRAP_SHA}}"
            [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
            docker buildx build \
              --platform linux/amd64 \
              --load \
              --tag community-backend:baseline \
              --build-arg "OCI_REVISION=${sha}" \
              --build-arg "OCI_VERSION=${sha}" \
              backend-source
          fi
      - name: Pull pinned infrastructure images
        run: |
          docker pull --platform linux/amd64 mysql:8.4.11@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0
          docker pull --platform linux/amd64 nginx:1.28.3-alpine3.23@sha256:0dcc88822d45581e65ae329f8be769762bf628d3b2bb7d2a077d4aa5c98b30e3
      - name: Start four-service stack
        run: |
          set -Eeuo pipefail
          root="${RUNNER_TEMP}/community-fe-smoke"
          compose_root="${GITHUB_WORKSPACE}/backend-deployment/deployment/ec2-compose"
          project="community-fe-${GITHUB_RUN_ID}"
          install -d -m 0750 "${root}"
          sudo install -d -o 999 -g 999 -m 0750 "${root}/data/mysql"
          sudo install -d -o 10001 -g 10001 -m 0750 "${root}/data/uploads"
          sudo install -d -o root -g 20000 -m 0750 "${root}/secrets"
          sudo install -d -o root -g root -m 0755 "${root}/acme"
          printf '%s\n' 'ci-root-password' | sudo tee "${root}/secrets/mysql-root-password" >/dev/null
          printf '%s\n' 'ci-app-password' | sudo tee "${root}/secrets/mysql-app-password" >/dev/null
          printf '%s\n' 'Y2ktb25seS1qd3Qtc2VjcmV0LTMyLWJ5dGVzISEhISE=' | sudo tee "${root}/secrets/jwt-secret" >/dev/null
          sudo chown root:20000 \
            "${root}/secrets/mysql-root-password" \
            "${root}/secrets/mysql-app-password" \
            "${root}/secrets/jwt-secret"
          sudo chmod 0640 \
            "${root}/secrets/mysql-root-password" \
            "${root}/secrets/mysql-app-password" \
            "${root}/secrets/jwt-secret"
          cat >"${root}/candidate.env" <<EOF
          MYSQL_IMAGE=mysql:8.4.11@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0
          BACKEND_IMAGE=community-backend:baseline
          FRONTEND_IMAGE=community-frontend:${GITHUB_SHA}
          NGINX_IMAGE=nginx:1.28.3-alpine3.23@sha256:0dcc88822d45581e65ae329f8be769762bf628d3b2bb7d2a077d4aa5c98b30e3
          IMAGE_PULL_POLICY=never
          DATA_ROOT=${root}/data
          SECRETS_DIR=${root}/secrets
          TLS_DIR=${root}/tls
          ACME_ROOT=${root}/acme
          COMPOSE_ROOT=${compose_root}
          FRONTEND_ORIGIN=http://127.0.0.1:${CI_HTTP_PORT}
          COOKIE_SECURE=false
          MEDIA_V2_ENABLED=false
          MEDIA_BUCKET=community-media-ci
          MEDIA_QUEUE_URL=https://sqs.ap-northeast-2.amazonaws.com/000000000000/community-media-ci
          MEDIA_API_ROLE_ARN=arn:aws:iam::000000000000:role/community-media-api-ci
          MEDIA_WORKER_ROLE_ARN=arn:aws:iam::000000000000:role/community-media-worker-ci
          MEDIA_CDN_BASE_URL=https://example.cloudfront.net
          MEDIA_DISTRIBUTION_ID=E0000000000000
          MEDIA_ENVIRONMENT=ci
          MEDIA_TRANSFORM_VERSION=1
          CI_HTTP_PORT=${CI_HTTP_PORT}
          EOF
          echo "SMOKE_ROOT=${root}" >>"${GITHUB_ENV}"
          echo "SMOKE_PROJECT=${project}" >>"${GITHUB_ENV}"
          docker compose --project-name "${project}" \
            --env-file "${root}/candidate.env" \
            -f "${compose_root}/compose.yaml" \
            -f "${compose_root}/compose.ci.yaml" \
            up --detach --remove-orphans --wait --wait-timeout 300
      - name: Verify edge and Backend E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
          E2E_API_BASE_URL: http://127.0.0.1:18080
          E2E_EXTERNAL_SERVER: "1"
        working-directory: frontend
        run: |
          curl --fail --silent --show-error "${E2E_BASE_URL}/healthz"
          curl --fail --silent --show-error "${E2E_BASE_URL}/api/csrf" >/dev/null
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e:backend
      - name: Stack diagnostics
        if: failure() && env.SMOKE_ROOT != ''
        run: |
          docker compose --project-name "${SMOKE_PROJECT}" \
            --env-file "${SMOKE_ROOT}/candidate.env" \
            -f backend-deployment/deployment/ec2-compose/compose.yaml \
            -f backend-deployment/deployment/ec2-compose/compose.ci.yaml \
            ps --all || true
          docker compose --project-name "${SMOKE_PROJECT}" \
            --env-file "${SMOKE_ROOT}/candidate.env" \
            -f backend-deployment/deployment/ec2-compose/compose.yaml \
            -f backend-deployment/deployment/ec2-compose/compose.ci.yaml \
            logs --no-color --tail 200 || true
      - name: Stop stack
        if: always() && env.SMOKE_ROOT != ''
        run: |
          docker compose --project-name "${SMOKE_PROJECT}" \
            --env-file "${SMOKE_ROOT}/candidate.env" \
            -f backend-deployment/deployment/ec2-compose/compose.yaml \
            -f backend-deployment/deployment/ec2-compose/compose.ci.yaml \
            down --volumes --remove-orphans

  required-gate:
    name: FE / required-gate
    if: always()
    needs: [quality-test, ui-test, image-build, compose-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require exact success from every prerequisite
        run: >-
          ./scripts/required-gate.sh
          '${{ needs.quality-test.result }}'
          '${{ needs.ui-test.result }}'
          '${{ needs.image-build.result }}'
          '${{ needs.compose-smoke.result }}'
